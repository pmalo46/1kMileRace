# Runs on every pull request and on main: the same typecheck and tests you can run locally
# with `npm run typecheck` and `npm test`.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch cancels the checks still running for the previous one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck (app and shared code)
        run: npm run typecheck

      - name: Tests (rules engine and database)
        run: npm test
